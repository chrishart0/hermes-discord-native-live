# One-time, owner-authorized migration. Removed from the published plugin tree.
name: Prepare public plugin
on:
  push:
    branches: [bootstrap/public-package]
permissions:
  contents: write
concurrency:
  group: public-package-bootstrap
  cancel-in-progress: true
jobs:
  import-and-verify:
    if: github.repository == 'chrishart0/hermes-discord-native-live'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: chrishart0/hermes-agent
          ref: 4cd99c713dc949a37d04bea50585d1697fae4414
          path: .bootstrap-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Import the exact existing plugin, retaining new packaging
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          source = Path('.bootstrap-source')
          assert (source / 'plugin.yaml').is_file()
          assert (source / 'native.py').is_file()
          for file in source.rglob('*'):
              rel = file.relative_to(source)
              if '.git' in rel.parts or '.github' in rel.parts or not file.is_file():
                  continue
              target = Path(rel)
              if not target.exists():
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(file, target)
          shutil.rmtree(source)
          PY
          git apply .migration.patch
          rm .migration.patch .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish standalone Discord native Live plugin v0.1.1'
      - name: Build and offline tests
        run: |
          python -m pip install '.[test]'
          python -m pytest -q
          python -m pip wheel . --no-deps -w /tmp/plugin-wheel
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 4b8a8134009a8727a289bcabeb0019fedd353128
          path: .hermes-host
          persist-credentials: false
      - name: Install real Hermes host
        run: python -m pip install -e './.hermes-host' 'discord.py[voice]==2.7.1'
      - name: Native installer and loader
        run: python scripts/check_hermes.py
      - name: Native admission regression
        env:
          HERMES_SOURCE: ${{ github.workspace }}/.hermes-host
        run: python -m pytest -q
      - name: Publish verified package to default branch
        run: |
          git push origin HEAD:master
          git log -1 --format='Published plugin commit: %H'
