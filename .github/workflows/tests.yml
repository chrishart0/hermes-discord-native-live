name: Tests
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: python -m compileall -q __init__.py audio.py live.py native.py plugin.py session.py
  hermes-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 4b8a8134009a8727a289bcabeb0019fedd353128
          path: .hermes-host
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e './.hermes-host' '.[test]' 'discord.py[voice]==2.7.1'
      - name: Native installer, loader and entry-point smoke test
        run: python scripts/check_hermes.py
      - name: Regression suite with actual host admission/key methods
        env:
          HERMES_SOURCE: ${{ github.workspace }}/.hermes-host
        run: python -m pytest -q
